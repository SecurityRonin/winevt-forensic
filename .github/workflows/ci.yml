name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07fa9b7c25b79c2efcd10cf86d7f3c5c25c0f # stable 2025-04-16
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d6fa2cca2caa7d7f61c # v2.7.8
      - run: cargo test --workspace --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07fa9b7c25b79c2efcd10cf86d7f3c5c25c0f # stable 2025-04-16
        with:
          components: clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d6fa2cca2caa7d7f61c # v2.7.8
      - run: cargo clippy --workspace --all-features -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b3b07fa9b7c25b79c2efcd10cf86d7f3c5c25c0f # stable 2025-04-16
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Checks are independent — run them in parallel and continue if one fails
    # so we see all failures at once.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@34899f7b1f7a08bcd8f7b9b0aded7575ab15dc3f # v2.0.8
        with:
          command: check ${{ matrix.checks }}
