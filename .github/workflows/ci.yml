name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@fefad0f1e71a5206e5258bc56b9147ae9d4cba73
    with:
      # MSRV is NOT overridden: the shared workflow reads each member's declared
      # rust-version and verifies every one at its own floor, which is stronger
      # than the single 1.88 job this replaces.
      #
      # Coverage is a FLOOR, not the fleet's per-line gate, and the number is
      # measured rather than aspirational: 81.25% with binaries excluded, at the
      # time of migration. This repo had no coverage gate at all before, so a
      # floor it actually meets is the honest starting point -- a strict gate
      # would be red on day one and switched off within the week. Raising it is
      # the follow-up work; `winevt-triage/src/partition.rs` sits at 0%.
      coverage-gate: floor
      coverage-floor: 81
      coverage-ignore-regex: '(^|/)src/(main\.rs|bin/)'
      # ubuntu-only until the Windows and macOS legs are proven. The repo parses
      # Windows artifacts but has never run its tests on Windows, so widening
      # the matrix here would be a separate change with its own failures.
      os-matrix: false
