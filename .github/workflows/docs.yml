name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build workspace docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options --default-theme ayu"

      - name: Add redirect index
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>winevt-forensic — Docs</title>
            <meta http-equiv="refresh" content="0; url=winevt_carver/index.html">
          </head>
          <body><p>Redirecting to <a href="winevt_carver/index.html">winevt_carver</a>&hellip;</p></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true
          commit_message: "docs: deploy cargo doc [skip ci]"
