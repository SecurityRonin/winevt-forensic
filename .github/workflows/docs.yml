name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # nightly
        with:
          toolchain: nightly

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build workspace docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "--enable-index-page -Zunstable-options --default-theme ayu"

      - name: Add redirect index
        run: |
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>winevt-forensic — Docs</title>
            <meta http-equiv="refresh" content="0; url=winevt_carver/index.html">
          </head>
          <body><p>Redirecting to <a href="winevt_carver/index.html">winevt_carver</a>&hellip;</p></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          force_orphan: true
          commit_message: "docs: deploy cargo doc [skip ci]"
