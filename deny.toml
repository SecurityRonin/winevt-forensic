# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Workspace members to check (default: all)
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ── Advisories ────────────────────────────────────────────────────────────────
[advisories]
# Reject crates with known security advisories
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2021-0153: `encoding` is unmaintained (a maintenance notice, NOT a
    # vulnerability). It is pulled transitively by `evtx` (0.11/0.12 both depend on
    # `encoding ^0.2.33`); we do not depend on it directly. Migrating off `encoding`
    # to `encoding_rs` is upstream evtx's responsibility, not something we can fix in
    # this workspace. Revisit and remove this ignore when evtx drops `encoding`.
    "RUSTSEC-2021-0153",
]

# ── Licenses ──────────────────────────────────────────────────────────────────
[licenses]
version = 2
# Allow common permissive and copyleft-compatible licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "0BSD",
]
# Under the v2 license schema, any license not in `allow` is denied — so the
# removed `unlicensed`/`copyleft`/`allow-osi-fsf-free`/`default` keys are now
# implicit (deny-by-default). See cargo-deny PR #611.

# ── Bans ──────────────────────────────────────────────────────────────────────
[bans]
# Deny multiple versions of the same crate when possible
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Skip duplicate version checks for well-known crates that have unavoidable
# dependency diamonds during the ecosystem transition period.
skip = [
    # Common crates that appear in multiple versions due to ecosystem churn
    { name = "syn", reason = "proc-macro ecosystem split on syn 1.x vs 2.x" },
    { name = "bitflags", reason = "bitflags 1.x vs 2.x split" },
    { name = "rustix", reason = "multiple dependents lock to different minor versions" },
    { name = "linux-raw-sys", reason = "paired with rustix" },
]

# Explicitly banned crates
deny = [
    # Unmaintained / known-bad crates
    { name = "openssl", reason = "use rustls instead for cross-platform TLS" },
    { name = "net2", reason = "unmaintained; use socket2" },
    { name = "tempdir", reason = "unmaintained; use tempfile" },
]

# ── Sources ───────────────────────────────────────────────────────────────────
[sources]
# Only allow crates from crates.io and our own workspace
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
