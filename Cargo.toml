[workspace]
resolver = "2"
members = [
    "crates/winevt-core",
    "crates/winevt-integrity",
    "crates/winevt-carver",
    "crates/winevt-memory",
    "crates/winevt-binxml",
    "crates/winevt-writer",
    "crates/winevt-analyze",
    "crates/wt-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/SecurityRonin/winevt-forensic"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
sha2 = "0.10"
rayon = "1"
ewf = "0.2"

# Internal
winevt-core = { path = "crates/winevt-core" }
winevt-binxml = { path = "crates/winevt-binxml" }
winevt-integrity = { path = "crates/winevt-integrity" }
winevt-carver = { path = "crates/winevt-carver" }
winevt-memory = { path = "crates/winevt-memory" }
winevt-writer = { path = "crates/winevt-writer" }
winevt-analyze = { path = "crates/winevt-analyze" }
wt-cli = { path = "crates/wt-cli" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
