[workspace]
resolver = "2"
members = [
    "crates/winevt-core",
    "crates/winevt-integrity",
    "crates/winevt-carver",
    "crates/winevt-memory",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/SecurityRonin/winevt-forensic"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# Internal
winevt-core = { path = "crates/winevt-core" }
winevt-integrity = { path = "crates/winevt-integrity" }
winevt-carver = { path = "crates/winevt-carver" }
winevt-memory = { path = "crates/winevt-memory" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
