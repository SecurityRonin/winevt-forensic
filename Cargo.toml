[workspace]
resolver = "2"
members = [
    "crates/winevt-core",
    "crates/winevt-integrity",
    "crates/winevt-carver",
    "crates/winevt-memory",
    "crates/winevt-binxml",
    "crates/winevt-writer",
    "crates/winevt-extract",
    "crates/winevt-manifest",
    "crates/winevt-analysis",
    "crates/winevt-triage",
    "crates/winevt-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/winevt-forensic"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
sha2 = "0.10"
rayon = "1"
ewf = "0.2"

# Internal (version + path: path drives local dev, version is used on publish)
winevt-core = { version = "0.2.1", path = "crates/winevt-core" }
winevt-binxml = { version = "0.1.1", path = "crates/winevt-binxml" }
winevt-integrity = { version = "0.2.1", path = "crates/winevt-integrity" }
winevt-carver = { version = "0.1.1", path = "crates/winevt-carver" }
winevt-memory = { version = "0.1.1", path = "crates/winevt-memory" }
winevt-writer = { version = "0.1.1", path = "crates/winevt-writer" }
winevt-extract = { version = "0.1.1", path = "crates/winevt-extract" }
winevt-manifest = { version = "0.1.0", path = "crates/winevt-manifest" }
forensicnomicon = { version = "1", features = ["serde"] }
winevt-triage = { version = "0.1.1", path = "crates/winevt-triage" }
winevt-cli = { version = "0.1.0", path = "crates/winevt-cli" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
