[workspace]
resolver = "2"
members = [
    "crates/winevt-core",
    "crates/winevt-integrity",
    "crates/winevt-carver",
    "crates/winevt-memory",
    "crates/winevt-binxml",
    "crates/winevt-writer",
    "crates/winevt-extract",
    "crates/winevt-manifest",
    "crates/winevt-analysis",
    "crates/winevt-triage",
    "crates/winevt-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/SecurityRonin/winevt-forensic"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tempfile = "3"
sha2 = "0.10"
rayon = "1"
ewf = "0.4"
# Fleet carving contract + single-pass sweep engine. ADR 0001.
forensic-carve = "0.1"
inventory = "0.3"
# Canonical mixed-endian GUID rendering — reuse the vetted crate rather than
# hand-roll the format string (from_bytes_le is the exact form; cf. dpapi).
uuid = "1"

# Internal (version + path: path drives local dev, version is used on publish)
winevt-core = { version = "0.3.0", path = "crates/winevt-core" }
winevt-binxml = { version = "0.1.3", path = "crates/winevt-binxml" }
winevt-integrity = { version = "0.3.1", path = "crates/winevt-integrity" }
winevt-carver = { version = "0.1.4", path = "crates/winevt-carver" }
winevt-memory = { version = "0.1.2", path = "crates/winevt-memory" }
winevt-writer = { version = "0.1.3", path = "crates/winevt-writer" }
winevt-extract = { version = "0.4.1", path = "crates/winevt-extract" }
winevt-manifest = { version = "0.1.1", path = "crates/winevt-manifest" }
forensicnomicon = { version = "1", features = ["serde"] }
winevt-triage = { version = "0.1.3", path = "crates/winevt-triage" }
winevt-cli = { version = "0.1.0", path = "crates/winevt-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
correctness = "deny"
suspicious = "deny"
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
# Pedantic cast noise — allowed fleet-wide (canonical [workspace.lints] recipe);
# the casts are on already-bounds-checked lengths / small test fixtures.
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
