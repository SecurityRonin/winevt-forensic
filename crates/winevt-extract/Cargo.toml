[package]
name = "winevt-extract"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EID-aware typed extraction of Windows Event Log records: timeline, session reconstruction, PowerShell block reassembly, and frequency analysis."

[lib]
name = "winevt_extract"

[dependencies]
base64 = "0.22"
evtx = "0.11"
jiff = "0.2"
regex = "1"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
forensicnomicon.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Narrow on purpose. Adopting the full workspace lint set here surfaces 54
# pedantic findings (40 of them `manual_let_else`) whose cleanup is a style
# refactor unrelated to unsafe enforcement, and which clippy cannot apply
# automatically. This closes the unsafe gap now; the clippy adoption is
# tracked separately.
[lints.rust]
unsafe_code = "forbid"
