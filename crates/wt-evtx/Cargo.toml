[package]
name = "wt-evtx"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "CLI tool for Windows Event Log forensic analysis"

[[bin]]
name = "wt-evtx"
path = "src/main.rs"

[dependencies]
winevt-core = { workspace = true }
winevt-session = { workspace = true }
winevt-analyze = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
chrono = { workspace = true }
evtx = "0.8"
serde_json = { workspace = true }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints]
workspace = true
