[package]
name = "winevt-forensic-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
winevt-core = { path = "../crates/winevt-core" }
winevt-carver = { path = "../crates/winevt-carver" }

[[bin]]
name = "fuzz_file_header"
