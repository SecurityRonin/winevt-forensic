test = false
doc = false

[[bin]]
name = "fuzz_chunk_header"
path = "fuzz_targets/fuzz_chunk_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_record_header"
path = "fuzz_targets/fuzz_record_header.rs"
test = false
doc = false

[[bin]]
name = "fuzz_carve_from_bytes"
path = "fuzz_targets/fuzz_carve_from_bytes.rs"
test = false
doc = false
